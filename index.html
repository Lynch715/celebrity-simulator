function renderProfile(){const tags=personaTags(S),f=calculateForecast(S),company=currentCompany(S);$("#identityText").textContent=`${S.playerName} · ${company.name} · ${BACKGROUNDS[S.background].name}`;$("#profileStrip").innerHTML=`<div class="row"><div><h2>${esc(S.playerName)}</h2><div class="meta">${GENDER_NAME[S.gender]} · ${company.name} · 全网排名 ${myRank(S)}/6</div></div><div class="number">公司关系 <b>${S.independent?"-—":S.companyFavor}</b></div></div><div class="tags">${(tags.length?tags:["尚未定型"]).map(t=>`<span class="pill gold">${t}</span>`).join("")}${S.romanceId?`<span class="pill red">${S.romancePublic?"公开恋情":"秘密恋情"}</span>`:""}</div><div class="loadbar"><i style="width:${Math.min(100,f.load*100)}%;background:${f.load>1?"var(--red)":"var(--cyan)"}"></i></div>`}
const ACTIONS=[{glyph:"▣",name:"争项目",desc:"公司/试镜/谈判",fn:()=>switchTab("projects")},{glyph:"◎",name:"跑人脉",desc:"18位关键人物",fn:()=>switchTab("relations")},{glyph:"♟",name:"管团队",desc:"编制/招聘/解约",fn:actTeam},{glyph:"▲",name:"练业务",desc:"表演/唱功/镜头",fn:actTrain},{glyph:"◇",name:"休息",desc:"健康/情绪/负荷",fn:actRest},{glyph:"!",name:"做公关",desc:"营业/公益/粉丝",fn:actPublicity}];
function renderActions(){$("#actions").innerHTML=ACTIONS.map((a,i)=>`<div class="action ${S.energy<=0?"off":""}" onclick="ACTIONS[${i}].fn()"><div class="glyph">${a.glyph}</div><div class="name">${a.name}</div><div class="desc">${a.desc}</div></div>`).join("")}
function renderSkills(){return `<div class="skill-table">${Object.entries(SKILLS).map(([k,v])=>`<div class="skill-cell"><b>${Math.round(S.skills[k])}</b><span>${v}</span></div>`).join("")}</div>`}
function renderSchedule(){const f=calculateForecast(S),future=[0,1,2].map(d=>{const m=S.month+d,l=monthLoad(S,m);return `<div class="schedule-line"><span class="month">${m>MAX_MONTH?"-—":`第${m}月`}</span><div class="bar"><i style="width:${Math.min(100,l*100)}%;background:${l>1?"var(--red)":"var(--cyan)"}"></i></div><span class="pct ${l>1?"down":""}">${Math.round(l*100)}%</span></div>`}).join("");const active=f.active.length?f.active.map(p=>`<div class="card"><div class="row"><div><span class="type">${PROJECT_TYPES[p.type].name}</span><h3>${p.title}</h3></div><span class="pill blue">至第${p.endMonth}月</span></div><div class="copy">当月负荷 ${Math.round(p.load*100)}% · 合同片酬 ${p.fee}万 · 主要考验 ${SKILLS[p.skill]}</div></div>`).join(""):`<div class="empty">当月没有已签项目。没有曝光很安静，也会被忘记。</div>`;const fee=currentBreakFee(S);$("#panel").innerHTML=`<div class="metric-grid"><div class="metric"><div class="v">${f.active.length}</div><div class="k">当月项目</div></div><div class="metric"><div class="v ${f.load>1?"down":""}">${Math.round(f.load*100)}%</div><div class="k">档期负荷</div></div><div class="metric"><div class="v ${f.net>=0?"up":"down"}">${f.net>=0?"+":""}${f.net}万</div><div class="k">预计净额</div></div></div><div class="card"><div class="section-head"><h2>未来三月档期</h2><span>超过100%会影响作品和健康</span></div>${future}</div>${active}<div class="card contract"><div class="row"><div><h3>${currentCompany(S).name}</h3><span class="pill gold">${S.independent?"独立经营":"经纪合约"}</span></div><div class="number">艺人分成 <b>${Math.round(playerShare(S)*100)}%</b></div></div><div class="copy">${S.independent?"项目、公关和团队成本都由你自己承担。":`当前解约金约${fee}万。可以随时提出解约，但公司不会轻易放人。`}</div>${S.independent?"":`<div class="card-actions"><button class="small danger" onclick="requestBreakContract()">提出解约</button></div>`}</div><div class="section-head"><h2>专业能力</h2><span>训练和项目都能提升</span></div>${renderSkills()}`}
function renderProjects(){$("#panel").innerHTML=`<div class="section-head"><h2>本月项目池</h2><span>1个公司安排 + 5个市场机会</span></div>${S.projects.map(p=>{const chance=auditionChance(S,p),max=projectedMaxLoad(S,p);return `<div class="card project-card ${p.status}"><div class="row"><div><span class="source">${p.source==="company"?"公司安排":p.source==="studio"?"工作室推荐":"市场机会"}</span><span class="type">${PROJECT_TYPES[p.type].name}</span><h3>${p.title}</h3></div><span class="pill ${p.status==="accepted"?"green":p.status==="lost"?"red":"blue"}">${p.status==="accepted"?"已签约":p.status==="lost"?"已失去":p.direct?"直接邀约":"待决定"}</span></div><div class="copy">${p.desc}</div><div class="attrs"><span class="attr">档期 ${p.duration}月</span><span class="attr">负荷 ${Math.round(p.load*100)}%</span><span class="attr">片酬 ${p.fee}万</span><span class="attr">${SKILLS[p.skill]} ${Math.round(S.skills[p.skill])}</span>${p.source==="market"&&!p.direct?`<span class="attr">${chanceText(chance)}</span>`:""}${max>1?`<span class="attr warning">最高负荷${Math.round(max*100)}%</span>`:""}</div>${p.status==="open"?`<div class="card-actions">${p.source!=="market"||p.direct?`<button class="small" onclick="acceptProject('${p.id}')">接受</button><button class="small" onclick="negotiateProject('${p.id}')">谈条件</button>`:`<button class="small" onclick="auditionProject('${p.id}')">去试镜 ·1行动力</button>`}<button class="small danger" onclick="refuseProject('${p.id}')">放弃</button></div>`:""}</div>`}).join("")}`}
function setTeamFilter(v){S.teamFilter=v;renderTeam()}
function renderTeam(){const labels={all:"全部",standby:"候补",vacancy:"空缺",manager:"经纪",executive:"执行",assistant:"助理",pr:"宣传",stylist:"造型",coach:"老师"},filters=["all","standby","vacancy",...TEAM_SLOTS.map(x=>x.id)];let html=`<div class="subnav">${filters.map(k=>`<button class="${S.teamFilter===k?"on":""}" onclick="setTeamFilter('${k}')">${labels[k]}</button>`).join("")}</div><div class="forecast"><span>实名团队 <b>${S.team.length}</b>人</span><span>候补 <b class="${standbyTeam(S).length?"down":"up"}">${standbyTeam(S).length}</b>人</span><span>月工资 <b>${totalPayroll(S)}万</b></span></div>`;if(S.teamFilter==="vacancy"){const rows=TEAM_SLOTS.filter(x=>!teamMember(S,x.id));html+=rows.length?rows.map(x=>`<div class="card vacancy"><div class="row"><h3>${x.name}</h3><span class="pill red">空缺</span></div><div class="copy">需要从候补人员中安排一名符合岗位的人。</div></div>`).join(""):`<div class="empty">个人团队已经配齐。</div>`}else{const rows=S.team.filter(x=>S.teamFilter==="all"||(S.teamFilter==="standby"&&!x.role)||x.role===S.teamFilter);html+=rows.length?rows.map(m=>`<div class="card"><div class="person-head"><div class="avatar">${m.name.slice(0,1)}</div><div class="person-main"><div class="row"><div><h3>${m.name}</h3> <span class="pill ${m.role?"blue":"red"}">${m.role?TEAM_MAP[m.role].name:"候补"}</span> <span class="pill">${m.faction}</span></div><div class="number">月薪 <b>${m.salary}万</b></div></div><div class="attrs"><span class="attr">能力 ${m.skill}</span><span class="attr">忠诚 ${m.loyalty}</span><span class="attr">好感 ${m.fav}</span><span class="attr">可任 ${m.eligible.map(x=>TEAM_MAP[x].name).join("/")}</span></div><div class="copy">${m.trait}</div><div class="card-actions">${!m.role?`<button class="small" onclick="chooseTeamAssignment(${m.id})">安排岗位</button>`:`<button class="small" onclick="moveTeamToStandby(${m.id})">调为候补</button>`}<button class="small danger" onclick="dismissTeam(${m.id})">解约</button></div></div></div></div>`).join(""):`<div class="empty">这个分类里没有人员。</div>`}$("#panel").innerHTML=html}
function setRelationFilter(v){S.relationFilter=v;renderRelations()}
function orientationAllows(n){if(!n.romance||S.orientation==="none")return false;if(S.orientation==="both")return true;return S.orientation==="same"?n.gender===S.gender:n.gender!==S.gender}
function renderRelations(){const groups=["all","公司","制作","平台","品牌","媒体","粉圈","艺人"];let html=`<div class="subnav">${groups.map(k=>`<button class="${S.relationFilter===k?"on":""}" onclick="setRelationFilter('${k}')">${k==="all"?"全部":k}</button>`).join("")}</div><div class="forecast"><span>每人每月只能正式见一次</span><span>好感60解锁资源</span></div>`;html+=S.npcs.filter(n=>S.relationFilter==="all"||n.group===S.relationFilter).map(n=>{const dating=S.romanceId===n.id;return `<div class="card ${dating?"romance":""}"><div class="person-head"><div class="avatar">${n.name.slice(0,1)}</div><div class="person-main"><div class="row"><div><h3>${n.name}</h3> <span class="pill">${n.group}</span>${n.id===bossId(S)?' <span class="pill gold">本公司</span>':""}${n.id==="rival_main"?' <span class="pill red">宿敌</span>':""}</div><div class="number">好感 <b>${n.fav}</b></div></div><div class="meta">${n.title}</div><div class="progress"><i style="width:${n.fav}%;background:${n.fav>=60?"var(--green)":"var(--cyan)"}"></i></div><div class="copy">${n.hint}</div><div class="copy ${n.fav>=60?"up":""}">${n.fav>=60?"已建立稳定关系：":"好感60解锁："}${n.perk}</div><div class="card-actions"><button class="small" ${n.lastMet===S.month||S.energy<=0?"disabled":""} onclick="interactNpc('${n.id}','report')">正式拜访</button><button class="small" ${n.lastMet===S.month||S.energy<=0?"disabled":""} onclick="interactNpc('${n.id}','dinner')">私下用餐 3万</button><button class="small" ${n.lastMet===S.month||S.energy<=0?"disabled":""} onclick="interactNpc('${n.id}','help')">帮忙牵线 8万</button>${orientationAllows(n)&&n.fav>=65?dating?`<button class="small danger" onclick="romanceMenu('${n.id}')">恋情选项</button>`:!S.romanceId?`<button class="small" onclick="pursueRomance('${n.id}')">试着靠近</button>`:"":""}</div></div></div></div>`}).join("");$("#panel").innerHTML=html}
function renderTrends(){const open=S.trends.filter(t=>t.status==="open").length;$("#panel").innerHTML=`<div class="section-head"><h2>本月热搜与舆情</h2><span>待处理 ${open}条</span></div><div class="forecast"><span>沉默不消耗行动力</span><span>回应、道歉、否认和起诉消耗1点</span></div>${S.trends.length?S.trends.map(t=>`<div class="card trend-card ${t.kind}"><div class="row"><div><span class="type">#${t.severity<=1?"上升":t.severity===2?"沸":"爆"}#</span><h3>${esc(t.title)}</h3></div><span class="pill ${t.status==="open"?"red":"green"}">${t.status==="open"?"待处理":"已处理"}</span></div><div class="copy">${esc(t.body)}</div>${t.status==="open"?`<div class="card-actions"><button class="small" onclick="handleTrend('${t.id}','silence')">保持沉默</button><button class="small" onclick="handleTrend('${t.id}','statement')">发声明</button><button class="small" onclick="handleTrend('${t.id}','apology')">道歉</button><button class="small" onclick="handleTrend('${t.id}','deny')">否认</button><button class="small" onclick="handleTrend('${t.id}','sue')">起诉 8万</button><button class="small danger" onclick="handleTrend('${t.id}','lower')">压热度 12万</button></div>`:""}</div>`).join(""):`<div class="empty">本月还没有与你有关的热搜。</div>`}`}
function renderRank(){const rows=S.competitors.map(c=>({name:c.name,route:c.route,score:c.score,me:false,main:c.main}));rows.push({name:S.playerName,route:personaTags(S).join("/")||"尚未定型",score:playerScore(S),me:true});rows.sort((a,b)=>b.score-a.score);$("#panel").innerHTML=`<table class="rank-table"><tr><th>#</th><th>艺人</th><th>路线</th><th>综合分</th></tr>${rows.map((r,i)=>`<tr class="${r.me?"me":""}"><td>${i+1}</td><td>${esc(r.name)}${r.main?" · 宿敌":""}</td><td>${r.route}</td><td>${round(r.score,1)}</td></tr>`).join("")}</table><div class="copy" style="margin-top:8px">综合分由知名度、路人缘、商业价值、代表作和奖项构成。五位竞争艺人也会接项目、爆红或翻车。</div>`}
function renderLog(){$("#panel").innerHTML=`<div class="log">${S.log.map(x=>`<p class="${x.cls||""}">${esc(x.text)}</p>`).join("")}</div>`}
function renderPanel(){({schedule:renderSchedule,projects:renderProjects,team:renderTeam,relations:renderRelations,trends:renderTrends,rank:renderRank,log:renderLog}[S.tab]||renderSchedule)()}
function switchTab(tab){S.tab=tab;document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===tab));renderPanel();save()}
function renderAll(){if(typeof document==="undefined"||!S)return;$("#monthText").textContent=S.month;$("#energyDots").textContent="●".repeat(S.energy)+"○".repeat(4-S.energy);renderStats();renderForecast();renderProfile();renderActions();document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));renderPanel();save()}

function actTrain(){if(!needEnergy())return;showModal("业务训练","训练会提升专业能力，也会消耗一点身心状态。",Object.entries(SKILLS).map(([k,v])=>eventOption(`集中训练${v}`,`${v}+5，身心小幅下降`,()=>{S.skills[k]=clamp(S.skills[k]+5);add(S,"health",-1);add(S,"mental",-2);spend()})).concat([eventOption("取消","",()=>{})]))}
function actRest(){if(!needEnergy())return;showModal("给自己留一天","经纪人问你：是真休息，还是边休息边营业？",[eventOption("关机睡觉","健康+10，心理+8，隐患缓解",()=>{add(S,"health",10);add(S,"mental",8);risk(S,"health",-7);risk(S,"mental",-7);spend()}),eventOption("去近郊放空","花3万，心理+12，私生活风险小幅上升",()=>{add(S,"cash",-3);add(S,"mental",12);add(S,"health",4);risk(S,"privacy",3);spend()}),eventOption("取消","",()=>{})])}
function actPublicity(){if(!needEnergy())return;showModal("主动营业","没有热搜时也可以主动建立公众形象。",[eventOption("拍一组日常内容","花3万，路人缘+2，粉丝+3",()=>{add(S,"cash",-3);add(S,"publicFavor",2);add(S,"fans",3);S.persona.idol+=2;spend()}),eventOption("参加公益活动","花8万，路人缘+5，公益形象提升",()=>{add(S,"cash",-8);add(S,"publicFavor",5);S.persona.public+=4;spend()}),eventOption("开一场粉丝直播","现金+5万，粉丝+5，粉圈风险上升",()=>{add(S,"cash",5);add(S,"fans",5);add(S,"commercial",2);risk(S,"fandom",5);S.persona.business+=2;spend()}),eventOption("取消","",()=>{})])}
function actTeam(){if(!needEnergy())return;showModal("管理个人团队","个人团队的岗位有限。新签的人会先进入候补，有空缺时再安排上岗。",[eventOption("查看团队和编制","不花行动力",()=>switchTab("team")),eventOption("面试本月候选人","签下一人花1行动力",()=>showTeamCandidates()),eventOption("发一次团队奖金","花20万，所有人忠诚和好感提升",()=>{add(S,"cash",-20);S.team.forEach(m=>{m.loyalty=clamp(m.loyalty+8);m.fav=clamp(m.fav+6)});risk(S,"team",-10);spend()},S.cash<20),eventOption("取消","",()=>{})])}
function showTeamCandidates(){showModal("本月团队候选人","签约后先进入候补名单。候补人员也会产生工资和不满。",S.candidates.map(c=>eventOption(`${c.name} · ${c.eligible.map(x=>TEAM_MAP[x].name).join("/")}`,`能力${c.skill} · 忠诚${c.loyalty} · 月薪${c.salary}万 · ${c.trait}`,()=>{S.team.push(c);S.candidates=S.candidates.filter(x=>x.id!==c.id);S.track.hires++;gameLog(S,"good",`${c.name}签约加入团队，当前处于候补。`);spend()})).concat([eventOption("都不合适","不花行动力",()=>{})]))}
function chooseTeamAssignment(id){const m=S.team.find(x=>x.id===id);if(!m)return;const rows=TEAM_SLOTS.filter(x=>m.eligible.includes(x.id)&&!teamMember(S,x.id));if(!rows.length){showModal("没有合适空缺",`${m.name}适合的岗位都已经有人。必须先让原来的人转为候补或解约。`,[{text:"知道了"}]);return}showModal(`安排${m.name}上岗`,"选择一个空缺岗位。",rows.map(x=>eventOption(x.name,"安排后立即生效",()=>{m.role=x.id;m.fav=clamp(m.fav+5);m.loyalty=clamp(m.loyalty+3);S.track.teamMoves++;gameLog(S,"good",`${m.name}被安排为${x.name}。`);renderAll()})))}
function moveTeamToStandby(id){const m=S.team.find(x=>x.id===id);if(!m||!m.role)return;const old=TEAM_MAP[m.role].name;showModal(`调离${m.name}`,`确定让${m.name}离开${old}岗位，转为候补？原岗位会立即空出。`,[eventOption("确认调离","好感-10，团队隐患上升",()=>{m.role=null;m.fav=clamp(m.fav-10);m.loyalty=clamp(m.loyalty-7);risk(S,"team",6);S.track.teamMoves++;renderAll()}),eventOption("取消","",()=>{})])}
function dismissTeam(id){const m=S.team.find(x=>x.id===id);if(!m)return;showModal(`与${m.name}解约`,`确定让${m.name}离开团队？${m.role?TEAM_MAP[m.role].name+"岗位会立即空出。":"候补工资将停止。"}`,[eventOption("确认解约","团队风险上升，可能引发爆料",()=>{S.team=S.team.filter(x=>x.id!==id);risk(S,"team",10);risk(S,"privacy",m.loyalty<45?8:2);S.track.fires++;gameLog(S,"bad",`${m.name}离开了个人团队。`);renderAll()}),eventOption("取消","",()=>{})])}
function interactNpc(id,method){if(!needEnergy())return;const n=S.npcs.find(x=>x.id===id);if(!n||n.lastMet===S.month)return;const costs={report:0,dinner:3,help:8};if(S.cash<costs[method]){showModal("现金不足","这次安排需要更多现金。",[{text:"知道了"}]);return}let delta=method===n.pref?8:method===n.avoid?-3:4;if(n.lastMethod===method){n.repeat++;delta=Math.max(1,delta-n.repeat*2)}else n.repeat=0;n.lastMethod=method;n.lastMet=S.month;n.tried[method]=delta;add(S,"cash",-costs[method]);relation(S,id,delta);S.track.relations++;if(method==="help"&&["zhou","han","lin","fang"].includes(id)){risk(S,"contract",3);S.track.gray++}spend();const text=delta>=7?"你说到了对方关心的事。分开前，对方主动提到了下一次合作。":delta<0?"对方礼貌地把话题岔开。这种方式并不适合他。":"谈话不坏，但还没到可以开口要资源的地步。";showModal(`${n.name} · ${method==="report"?"正式拜访":method==="dinner"?"私下用餐":"帮忙牵线"}`,`${text}

好感${delta>=0?"+":""}${delta}${costs[method]?`，花费${costs[method]}万`:""}。`,[{text:"告辞"}])}
function pursueRomance(id){if(!needEnergy()||S.romanceId)return;const n=S.npcs.find(x=>x.id===id);if(!orientationAllows(n)||n.fav<65)return;showModal(`试着靠近${n.name}`,"这不是一次营业安排。真实关系会给你带来支持，也会变成媒体和粉圈的突破口。",[eventOption("说出真心话","建立秘密恋情，心理+8，私生活风险上升",()=>{S.romanceId=id;relation(S,id,8);add(S,"mental",8);risk(S,"privacy",12);gameLog(S,"good",`你和${n.name}开始了一段没有对外公开的关系。`);spend()}),eventOption("还是做朋友","不花行动力",()=>{})])}

function generateTrends(s){let count=Math.random()<(s.fame/170+.3)?1:0;if(Math.random()<s.fame/230)count++;count=Math.min(2,count);const pool=TREND_TEMPLATES.filter(t=>!t.cond||t.cond(s)),rows=[];for(let i=0;i<count;i++){const t=pick(pool);rows.push({...t,id:`trend_${s.month}_${i}_${Math.floor(Math.random()*999)}`,status:"open"})}return rows}
function applyTrendResult(t,method){const pr=teamPower(S,"pr")+(currentCompany(S).pr||0),truth=t.truth,sev=t.severity;let good=false,text="";if(method==="silence"){good=t.kind==="good"||sev===1;add(S,"publicFavor",t.kind==="good"?2:-sev);add(S,"fans",t.kind==="good"?2:-1);risk(S,"fandom",t.kind==="good"?-1:sev*2);text=good?"话题自然扩散，没有被过度营业。":"团队没有回应，质疑在沉默里延续了一阵。"}else if(method==="statement"){good=Math.random()<.42+pr*.25;add(S,"publicFavor",good?3:-sev*2);add(S,"fans",good?2:-2);text=good?"声明抓住了争议重点，话题开始降温。":"声明写得像一份没有人负责的合同，反而引发更多猜测。"}else if(method==="apology"){good=truth!=="false";add(S,"publicFavor",good?4:-3);add(S,"fans",good?-2:-4);risk(S,"privacy",good?-2:2);text=good?"道歉没有让所有人满意，但至少停止了进一步消耗。":"对本来就不属于你的问题道歉，让公众觉得你默认了指控。"}else if(method==="deny"){good=truth==="false";add(S,"publicFavor",good?4:-sev*3);add(S,"fans",good?3:-2);risk(S,"privacy",good?-2:sev*4);text=good?"证据很快跟上，造谣账号删除了内容。":"否认得太快，而新的证据比声明更快出现。"}else if(method==="sue"){add(S,"cash",-8);good=truth!=="true"&&Math.random()<.55+pr*.2;add(S,"publicFavor",good?5:-4);risk(S,"contract",good?-2:4);text=good?"律师函与取证同时进行，几个主要传播账号删除了内容。":"起诉并没有回答公众最关心的问题，争议反而延长了。"}else{add(S,"cash",-12);good=true;add(S,"publicFavor",t.kind==="good"?-1:1);risk(S,"tax",3);risk(S,"contract",2);S.track.gray++;text="话题从榜单上消失了。没有人说清这笔钱最后记在了哪一项服务里。"}t.status="handled";S.track.trends++;gameLog(S,good?"good":"bad",`处理热搜「${t.title}」：${text}`);showModal(good?"话题开始降温":"公关没有奏效",text,[{text:"看看后续"}]);renderAll()}
function handleTrend(id,method){const t=S.trends.find(x=>x.id===id);if(!t||t.status!=="open")return;if(method!=="silence"&&!needEnergy())return;if((method==="sue"&&S.cash<8)||(method==="lower"&&S.cash<12)){showModal("现金不足","这种处理方式需要更多现金。",[{text:"知道了"}]);return}if(method!=="silence")spend();applyTrendResult(t,method)}

function completeProject(s,p,rng=Math.random){const load=monthLoad(s,s.month),company=currentCompany(s),coach=teamPower(s,"coach"),support=teamPower(s,"executive")+teamPower(s,"assistant")*.4+(p.type==="endorsement"?teamPower(s,"stylist")*.5:0),base=s.skills[p.skill]*.57+s.health*.11+s.mental*.1+coach*9+support*5+(company.quality||0)+(rng()-.5)*25-Math.max(0,load-1)*32,quality=clamp(Math.round(base),10,99);let tier="反响平平",mult=.55;if(quality>=88){tier="爆款";mult=1.75;s.track.hits++}else if(quality>=74){tier="口碑成功";mult=1.25;s.track.hits++}else if(quality>=58){tier="平稳完成";mult=.9}else if(quality<40){tier="翻车";mult=.2;s.track.flops++}add(s,"fame",p.fameGain*mult);add(s,"publicFavor",p.repGain*mult+(quality<40?-5:0));add(s,"commercial",p.commercialGain*mult);add(s,"fans",p.fanGain*mult+(quality<40?-4:0));s.skills[p.skill]=clamp(s.skills[p.skill]+Math.max(1,p.duration));s.track.projects++;s.track[p.type]=(s.track[p.type]||0)+1;s.track.bestQuality=Math.max(s.track.bestQuality,quality);if(quality>=82&&["film","drama","music","stage"].includes(p.type))s.track.nominations++;projectPersona(s,p);gameLog(s,quality>=74?"good":quality<40?"bad":"",`${p.title}完成，内部成片评估${quality}分，${tier}。`);return{title:p.title,type:p.type,quality,tier}}
function advanceCompetitors(s,rng=Math.random){s.competitors.forEach(c=>{let growth=.45+c.momentum*.7+(rng()-.5)*1.5;if(rng()<.08)growth+=rng()*5;if(rng()<.035)growth-=rng()*6;c.score=clamp(c.score+growth,12,125)});const main=s.competitors.find(c=>c.main),rel=s.npcs.find(n=>n.id==="rival_main");if(main&&rel&&rel.fav>=75)main.score+=.2}
function settleCore(s,rng=Math.random){const before={cash:s.cash,fame:s.fame,publicFavor:s.publicFavor,commercial:s.commercial,fans:s.fans,condition:(s.health+s.mental)/2},active=activeInMonth(s,s.month),load=active.reduce((a,p)=>a+p.load,0),gross=active.reduce((a,p)=>a+p.fee*playerShare(s)/p.duration,0),payroll=totalPayroll(s),tax=round(gross*.08,1),over=load>1?round((load-1)*12,1):0,expense=round(payroll+3+tax+over,1),net=round(gross-expense,1);add(s,"cash",net);s.track.income+=gross;s.track.expense+=expense;s.trends.filter(t=>t.status==="open").forEach(t=>resolveIgnoredTrend(s,t));if(load>.75){const hp=Math.max(1,(load-.65)*8),mp=Math.max(1,(load-.55)*7);add(s,"health",-hp);add(s,"mental",-mp);risk(s,"health",load>1?8:3);risk(s,"mental",load>1?7:2);risk(s,"team",load>1?6:1)}else if(load<.3){add(s,"health",3);add(s,"mental",2);add(s,"fame",-1)}if(standbyTeam(s).length){risk(s,"team",standbyTeam(s).length*3);s.team.filter(x=>!x.role).forEach(x=>x.fav=clamp(x.fav-2))}if(s.cash<0){risk(s,"contract",8);risk(s,"tax",5);add(s,"mental",-4)}if(s.flags.taxPlan&&s.flags.taxPlan>=s.month)risk(s,"tax",3);const completed=active.filter(p=>p.endMonth===s.month).map(p=>completeProject(s,p,rng));s.activeProjects=s.activeProjects.filter(p=>p.endMonth>s.month);advanceCompetitors(s,rng);s.team.forEach(m=>{if(load>1)m.loyalty=clamp(m.loyalty-2);else if(load<.65)m.loyalty=clamp(m.loyalty+1)});s.track.maxFame=Math.max(s.track.maxFame,s.fame);s.track.minCondition=Math.min(s.track.minCondition,(s.health+s.mental)/2);s.last={income:round(gross,1),expense,net,load,active:active.length,payroll,tax,over};s.lastDelta={cash:s.cash-before.cash,fame:s.fame-before.fame,publicFavor:s.publicFavor-before.publicFavor,commercial:s.commercial-before.commercial,fans:s.fans-before.fans,condition:(s.health+s.mental)/2-before.condition};return{...s.last,completed}}
function chooseEvent(){const rows=EVENTS.filter(e=>(!e.cond||e.cond())&&!S.usedEvents.includes(e.id)&&e.id!==S.lastEvent);if(!rows.length)return null;const e=pick(rows);S.lastEvent=e.id;if(e.once)S.usedEvents.push(e.id);return e}
function riskWarning(){const rows=Object.keys(S.risks).filter(k=>S.risks[k]>=64&&(S.warningMonth[k]||0)<S.month-1);if(!rows.length)return null;rows.sort((a,b)=>S.risks[b]-S.risks[a]);return Math.random()<.76?rows[0]:pick(rows)}
function disasterCheck(){const candidates=Object.keys(S.risks).filter(k=>S.risks[k]>=94&&S.warnings[k]>=2);if(!candidates.length)return null;const k=candidates.sort((a,b)=>S.risks[b]-S.risks[a])[0];if(S.risks[k]<108&&Math.random()>.48)return null;const endings={contract:["全面雪藏","公司和平台交叉核对合同后，同时启动了违约追责。待播项目暂停，工作室账户被保全，你的名字从新项目名单中消失。"],tax:["税务风暴","调查通报公布的那天，所有品牌同时下架了你的物料。补税和罚款只是第一步，你的职业信用已经破产。"],health:["片场倒下","连轴转的第十七天，你在镜头前失去意识。医生要求至少停工一年，所有合同进入重新谈判。"],mental:["退出镜头","你没有出现在当天的直播里。工作室发布公告，称你将无限期暂停演艺工作。这是你第一次主动把自己从热搜上拿下来。"],privacy:["私生活彻底曝光","聊天记录、行程和私人视频被打包发布。真实、剪辑和伪造内容混在一起，公众已经没有耐心分辨。"],team:["团队集体出走","经纪人、宣传和助理先后辞职，随后一份记录工作室混乱管理的长文登上热搜。所有项目失去对接人。"],fandom:["粉圈失控","一场线下冲突造成人员受伤。舆论将长期纵容、集资和攻击他人的责任全部追溯到你和工作室。"]};return endings[k]}
function showReport(r){$("#modalTitle").textContent=`第${S.month}月 · 收入与状态`;const body=$("#modalBody");body.innerHTML="";[["项目到手收入",`+${r.income}万`],["团队工资",`-${r.payroll}万`],["个人税费",`-${r.tax}万`],["生活与基础支出","-3万"],...(r.over?[["超负荷临时成本",`-${r.over}万`]]:[])].forEach(([k,v])=>{const d=document.createElement("div");d.className="report-line";d.innerHTML=`<span>${k}</span><span class="${v[0]==="+"?"up":"down"}">${v}</span>`;body.appendChild(d)});const sum=document.createElement("div");sum.className="report-line";sum.innerHTML=`<span><b>档期负荷 ${Math.round(r.load*100)}% · 完成项目 ${r.completed.length}</b></span><span class="${r.net>=0?"up":"down"}">${r.net>=0?"+":""}${r.net}万</span>`;body.appendChild(sum);const box=$("#modalOptions");box.innerHTML='<button>下一步</button>';box.firstChild.onclick=()=>{$("#mask").classList.remove("show");flushQueue()};$("#mask").classList.add("show")}
function showCompletion(c){showModal(`${PROJECT_TYPES[c.type].name}完成 · ${c.tier}`,`${c.title}

内部成片评估：${c.quality}分。

作品的真正影响已经计入知名度、路人缘、商业价值和粉丝忠诚。`,[{text:"看观众反应"}])}
function annualReview(){const year=Math.ceil(S.month/12),eligible=S.track.nominations-S.track.awards,win=eligible>0&&S.track.bestQuality>=76&&Math.random()<clamp(.25+(S.track.bestQuality-70)/70+S.publicFavor/300,.2,.82);if(eligible>0){if(win){S.track.awards++;add(S,"fame",9);add(S,"publicFavor",7);add(S,"commercial",7)}else add(S,"fame",3)}const rival=pick(S.competitors),text=eligible<=0?`第${year}个年度的各类奖项公布名单，你没有进入主要奖项候选。${rival.name}在其中一场盛典上获得了提名。`:win?`颁奖嘉宾念出你的名字。这是职业生涯的第${S.track.awards}个主要奖项，热搜从作品一直延伸到你走上舞台时的表情。`:`你进入了主要奖项候选，但最终奖杯去了别人手里。至少从今天开始，你的名字已经不只出现在热搜榜。`;showModal(`第${year}年 · 年度奖项季`,text,[{text:win?"握紧奖杯":"记住这一夜"}])}
function nextMonth(){S.month++;S.energy=4;S.projects=generateProjects(S);S.candidates=makeTeamCandidates(S);S.trends=generateTrends(S);gameLog(S,"month",`—— 第${S.month}月 · 新项目和新热搜已刷新 ——`);flushQueue()}
function endingFor(s){const rank=myRank(s),rival=s.npcs.find(n=>n.id==="rival_main"),main=s.competitors.find(c=>c.main),clean=s.track.gray===0,condition=(s.health+s.mental)/2;if(s.track.awards>=2&&s.persona.actor>=18)return[s.gender==="female"?"影后":"影帝","你的名字第二次出现在重要奖杯上。有人还在讨论热度，但行业已经开始用角色和作品定义你。",true];if(s.track.awards>=1&&s.persona.music>=20)return[s.gender==="female"?"金曲歌后":"金曲歌王","从第一段被质疑的现场直拍，到整片会场合唱你的歌，你终于拥有了不依附人设的作品。",true];if(rank===1&&s.fame>=85&&s.fans>=70)return["顶流中心","三十六个月里，你的名字从新人官宣爬到每一个重要榜单的最上方。现在的问题不再是谁会看见你，而是你要让他们看见什么。",true];if(s.independent&&s.cash>90&&rank<=3)return["独立工作室","你付完违约金、补齐人员，也熟悉了每一笔成本。第三十六个月，工作室的门牌终于不再是一句口号。",true];if(rival.fav>=82&&Math.abs(playerScore(s)-main.score)<10)return["双星并耀","你和当年一起签约的那个人，终究没有将对方挤出这条路。你们争过角色、番位和奖项，最后也成了彼此最可靠的参照物。",true];if(s.track.variety>=7&&s.persona.variety>=24)return["综艺常青树","当同期艺人还在等新剧定档时，你已经成了每年都有节目等着的名字。观众或许不知道你下一个角色，但知道有你的节目不会冷场。",true];if(s.track.endorsement>=7&&s.commercial>=82&&s.cash>120)return["商业宠儿","从国民饮料到奢侈品，品牌把你的名字写进了年度计划。作品仍有争议，但市场已经给出了最直接的报价。",true];if(clean&&s.publicFavor>=78&&condition>=65)return["干净的名字","你没有把所有机会都换成热度，也没有让每一次沉默都变成默认。三年后，你的公众信用比任何一次热搜都更值钱。",true];if(rank===6&&main.score>playerScore(s)+18)return["宿敌的胜利",`三十六个月前，你和${rival.name}坐在同一张桌前签约。现在对方站在了你曾经想去的位置。你没有退圈，但下一份合同已经不再由你开价。`,false];if(s.fame<35||s.cash<0)return["过气与转型","热搜慢慢不再出现你的名字。这未必是结束：你开始学着把主持、教学、制作和小角色当作工作，而不是失败。",false];return[rank<=3?"稳定一线":"圈内有名",rank<=3?"你没有成为神话，也没有被一次风波带走。三年后，项目方会认真讨论你的档期和报价，这已经是很多人没有到达的位置。":"三年过去，你仍然有工作、有粉丝，也有几个能被记住的镜头。星途没有实现当年所有的想象，但还没有关门。",rank<=3]}
function showEnd(title,story,good){S.over=true;S.endData={title,story,good};save();modalQueue=[];$("#mask").classList.remove("show");const badges=[];if(S.track.awards)badges.push("奖项认可");if(S.track.bestQuality>=85)badges.push("代表作");if(S.fame>=85)badges.push("全民知名");if(S.publicFavor>=75)badges.push("国民好感");if(S.track.gray===0)badges.push("账目干净");if(S.independent)badges.push("独立艺人");if(S.romanceId)badges.push(S.romancePublic?"公开爱人":"秘密关系");if(myRank(S)===1)badges.push("榜首");if(!badges.length)badges.push("撑完三年");const grid=[["三年净现金",`${Math.round(S.cash-(BACKGROUNDS[S.background].cash+COMPANIES[S.company].advance))}万`],["完成项目",`${S.track.projects}个`],["最佳作品",`${S.track.bestQuality}分`],["主要奖项",`${S.track.awards}个`],["最终排名",`第${myRank(S)}名`],["团队规模",`${S.team.length}人`]];$("#endCard").innerHTML=`<div class="eyebrow">《模拟明星》36个月结算 · ${esc(S.playerName)}</div><h2>${good?"▣":"□"} ${title}</h2><div class="story">${story}</div><div class="metric-grid">${grid.map(([k,v])=>`<div class="metric"><div class="v">${v}</div><div class="k">${k}</div></div>`).join("")}</div><div class="badges">${badges.map(x=>`<span class="badge">${x}</span>`).join("")}</div><button class="primary" style="width:100%;margin-top:10px" onclick="restartGame()">重新签一份合约</button>`;$("#ending").classList.add("show")}
function endMonth(){if(S.over)return;if(S.energy>0){showModal("本月还有行动力",`还剩${S.energy}点行动力，确定直接进入月末结算？`,[eventOption("直接结算","剩余行动力作废",()=>doEndMonth()),eventOption("回去再看看","",()=>{})]);return}doEndMonth()}
function doEndMonth(){const report=settleCore(S),tasks=[()=>showReport(report)];report.completed.forEach(c=>tasks.push(()=>showCompletion(c)));const disaster=disasterCheck();if(disaster){tasks.push(()=>showEnd(disaster[0],disaster[1],false));queueAll(tasks);return}const warning=riskWarning();if(warning){const w=RISK_WARNINGS[warning];S.warningMonth[warning]=S.month;S.warnings[warning]++;tasks.push(()=>showModal(`风险征兆 · ${w.title}`,w.body,[eventOption(w.fix,`花${w.cost}万`,()=>{add(S,"cash",-w.cost);risk(S,warning,w.delta);if(warning==="health")add(S,"health",8);if(warning==="mental")add(S,"mental",9);gameLog(S,"good",`${RISK_NAMES[warning]}方面进行了一次专项整改。`)},S.cash<w.cost),eventOption("现在还能撑","征兆暂时不影响表面工作",()=>{risk(S,warning,w.ignore);gameLog(S,"bad",`${w.title}被暂时搁置。`)})]))}else{const e=chooseEvent();if(e){const body=typeof e.body==="function"?e.body():e.body;tasks.push(()=>showModal(`圈内事件 · ${e.title}`,body,e.opts()))}}if(S.month%12===0)tasks.push(()=>annualReview());if(S.month>=MAX_MONTH)tasks.push(()=>{const e=endingFor(S);showEnd(e[0],e[1],e[2])});else tasks.push(()=>nextMonth());queueAll(tasks)}

function init(){renderCreatorChoices();if(load()){$("#creator").classList.remove("show");renderAll();if(S.over&&S.endData)setTimeout(()=>showEnd(S.endData.title,S.endData.story,S.endData.good),0)}else $("#creator").classList.add("show");$("#endMonthBtn").onclick=endMonth;$("#resetBtn").onclick=requestRestart;document.querySelectorAll("#tabs button").forEach(b=>b.onclick=()=>switchTab(b.dataset.tab));document.addEventListener("click",()=>document.querySelectorAll(".stat.tip-on").forEach(x=>x.classList.remove("tip-on")))}
